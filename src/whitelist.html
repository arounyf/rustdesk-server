<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RustDesk 白名单管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.5 system-ui,sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.header{background:#1a1a2e;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:500}
.container{max-width:960px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:20px;margin-bottom:16px}
.card h2{font-size:15px;margin-bottom:14px;color:#1a1a2e}
.form-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.form-row input,.form-row select{padding:8px 12px;border:1px solid #d9d9d9;border-radius:4px;font-size:14px}
.form-row input{flex:1;min-width:140px}
.form-row select{width:160px}
.form-row button{padding:8px 16px;border:none;border-radius:4px;font-size:14px;cursor:pointer;color:#fff}
.btn-add{background:#1890ff}
.btn-add:hover{background:#40a9ff}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f0f0f0}
th{font-weight:500;color:#666;font-size:13px}
.locked{background:#fff1f0}
.locked td{color:#999}
.never{color:#52c41a}
.btn-re{background:none;border:1px solid #1890ff;color:#1890ff;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;margin-right:4px}
.btn-re:hover{background:#1890ff;color:#fff}
.btn-lock{background:none;border:1px solid #faad14;color:#faad14;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;margin-right:4px}
.btn-lock:hover{background:#faad14;color:#fff}
.btn-unlock{background:none;border:1px solid #52c41a;color:#52c41a;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;margin-right:4px}
.btn-unlock:hover{background:#52c41a;color:#fff}
.btn-del{background:none;border:1px solid #ff4d4f;color:#ff4d4f;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px}
.btn-del:hover{background:#ff4d4f;color:#fff}
.token-bar{background:#fffbe6;border:1px solid #ffe58f;padding:8px 16px;border-radius:4px;margin-bottom:16px;display:none}
.empty{text-align:center;color:#999;padding:30px}
.note-cell{padding:0!important}
.note-cell input{border:1px solid transparent;background:transparent;width:100%;padding:10px 12px;font-size:14px;border-radius:4px;outline:none}
.note-cell input:focus{border-color:#1890ff;background:#fff}
.act-group{white-space:nowrap}
</style>
</head>
<body>
<div class="header"><h1>RustDesk 白名单管理</h1><span id="count"></span></div>
<div class="container">
<div class="token-bar" id="tokenBar">Token 未设置，在 URL 后加 ?token=xxx 或点击 <a href="#" onclick="setToken()">设置</a></div>
<div class="card">
<h2>添加设备</h2>
<div class="form-row">
<input id="newId" placeholder="客户端 ID">
<select id="expireSelect">
<option value="0">永不过期</option>
<option value="7">7 天</option>
<option value="30">30 天</option>
<option value="180">180 天</option>
<option value="365">365 天</option>
<option value="-1">自定义...</option>
</select>
<input id="customDays" type="number" placeholder="自定义天数" style="display:none;width:120px" min="1">
<input id="newNote" placeholder="备注（可选）">
<button class="btn-add" onclick="add()">添加</button>
</div>
</div>
<div class="card">
<h2>白名单列表</h2>
<div id="list"></div>
</div>
</div>
<script>
let token = new URLSearchParams(location.search).get('token') || localStorage.getItem('wl_token') || '';

function setToken() {
    const t = prompt('输入 API Token:');
    if (t) { token = t; localStorage.setItem('wl_token', t); load(); }
}

document.getElementById('expireSelect').onchange = function() {
    document.getElementById('customDays').style.display = this.value === '-1' ? '' : 'none';
};

async function api(method, path, body) {
    const opts = { method, headers: { 'Authorization': 'Bearer ' + token } };
    if (body) opts.body = body;
    const r = await fetch(path, opts);
    return r.text();
}

async function load() {
    if (!token) { document.getElementById('tokenBar').style.display = 'block'; return; }
    document.getElementById('tokenBar').style.display = 'none';
    const data = await api('GET', '/api/list');
    try {
        const entries = JSON.parse(data);
        const now = Math.floor(Date.now() / 1000);
        let html = '<table><tr><th>客户端 ID</th><th>创建时间</th><th>到期时间</th><th>状态</th><th>备注</th><th>操作</th></tr>';
        if (entries.length === 0) html = '<div class="empty">暂无设备</div>';
        entries.forEach(e => {
            const expired = e.expire_at && e.expire_at < now && e.expire_at > 1;
            const locked = e.locked;
            const cls = locked ? 'locked' : (expired ? 'expired' : '');
            const expStr = e.expire_at ? new Date(e.expire_at*1000).toLocaleString('zh-CN') : '<span class="never">永不过期</span>';
            const createdStr = new Date(e.created_at*1000).toLocaleString('zh-CN');
            const status = locked ? '<span style="color:#ff4d4f">已锁定</span>' :
                (expired ? '<span style="color:#faad14">已过期</span>' : '<span style="color:#52c41a">正常</span>');
            html += `<tr class="${cls}"><td>${e.id}</td><td>${createdStr}</td><td>${expStr}</td><td>${status}</td>`;
            html += `<td class="note-cell"><input value="${esc(e.note||'')}" data-id="${e.id}" data-old="${esc(e.note||'')}" onfocus="this.dataset.old=this.value" onblur="saveNote(this)" onkeydown="if(event.key==='Enter')this.blur()"></td>`;
            html += '<td class="act-group">';
            if (!locked && !expired) {
                html += `<button class="btn-re" onclick="renew('${e.id}',7)">7天</button>`;
                html += `<button class="btn-re" onclick="renew('${e.id}',30)">30天</button>`;
                html += `<button class="btn-re" onclick="renew('${e.id}',0)">永久</button>`;
                html += `<button class="btn-lock" onclick="toggleLock('${e.id}',true)">锁</button>`;
            } else if (locked) {
                html += `<button class="btn-unlock" onclick="toggleLock('${e.id}',false)">解锁</button>`;
            } else if (expired) {
                html += `<button class="btn-re" onclick="renew('${e.id}',30)">续期</button>`;
            }
            html += `<button class="btn-del" onclick="remove('${e.id}')">删</button></td></tr>`;
        });
        html += '</table>';
        document.getElementById('list').innerHTML = html;
        document.getElementById('count').textContent = entries.length + ' 台设备';
    } catch(e) { document.getElementById('list').innerHTML = '<div class="empty">加载失败</div>'; }
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function saveNote(input) {
    const id = input.dataset.id;
    const note = input.value.trim();
    if (note === input.dataset.old) return;
    await api('POST', '/api/note', JSON.stringify({ id, note }));
    input.dataset.old = note;
}

async function add() {
    const id = document.getElementById('newId').value.replace(/\s/g, '');
    if (!id) return alert('请输入客户端 ID');
    const note = document.getElementById('newNote').value.trim();
    let days = parseInt(document.getElementById('expireSelect').value);
    if (days === -1) days = parseInt(document.getElementById('customDays').value) || 0;
    const expireAt = days > 0 ? Math.floor(Date.now()/1000) + days*86400 : 0;
    await api('POST', '/api/add', JSON.stringify({ id, expire_at: expireAt, note }));
    document.getElementById('newId').value = '';
    document.getElementById('newNote').value = '';
    load();
}

async function renew(id, days) {
    await api('POST', '/api/renew', JSON.stringify({ id, expire_at: days > 0 ? days : 0 }));
    load();
}

async function toggleLock(id, lock) {
    await api('POST', '/api/' + (lock ? 'lock' : 'unlock'), JSON.stringify({ id }));
    load();
}

async function remove(id) {
    if (!confirm('确定删除 ' + id + ' ?')) return;
    await api('POST', '/api/remove', JSON.stringify({ id }));
    load();
}

load();
</script>
</body>
</html>
